# Локальная разработка: подхватывается автоматически простым
# `docker compose up` (без -f), публикует порты на хосте для удобства.
# На проде команда явно указывает файлы (-f docker-compose.yml
# -f docker-compose.prod.yml), поэтому этот файл там не участвует и
# backend/frontend остаются закрыты снаружи — доступ только через Caddy.
services:
  backend:
    ports:
      - "8080:8080"
  frontend:
    ports:
      - "3000:3000"
