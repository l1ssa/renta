services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renta
      POSTGRES_PASSWORD: renta
      POSTGRES_DB: renta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renta"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-too-please-and-make-it-random}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: renta
      POSTGRES_PASSWORD: renta
      POSTGRES_DB: renta
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
