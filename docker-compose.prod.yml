# Продовый оверлей: добавляет Caddy (автоматический HTTPS по домену) и
# закрывает прямой доступ к frontend/backend портам — весь трафик идёт
# через Caddy. Использование:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Перед запуском задайте в .env:
#   DOMAIN=ваш-домен.ru
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      INTERNAL_API_URL: http://backend:8080/api
    ports: []

  backend:
    ports: []

volumes:
  caddy_data:
  caddy_config:
