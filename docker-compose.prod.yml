# Продовый оверлей: добавляет Caddy (автоматический HTTPS по домену).
# В базовом docker-compose.yml у backend/frontend нет публикуемых портов —
# наружу торчит только Caddy (80/443), backend и frontend видны только
# внутри докер-сети. Порты 8080/3000 наружу публикуются отдельно, только
# для локальной разработки, через docker-compose.override.yml (подхватывается
# автоматически простым `docker compose up`, но не при явном -f, как здесь).
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Перед запуском задайте в .env:
#   DOMAIN=ваш-домен.ru
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      INTERNAL_API_URL: http://backend:8080/api

volumes:
  caddy_data:
  caddy_config:
